
spring.application.name=entrelinhas
spring.docker.compose.enabled=false
server.port=${SERVER_PORT:8002}

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.entrelinhas=INFO

# Tesseract OCR
tesseract.datapath=${TESSERACT_DATA_PATH}
tesseract.language=${TESSERACT_LANGUAGE:por}
tesseract.page-seg-mode=${TESSERACT_PAGE_SEG_MODE:3}
tesseract.ocr-engine-mode=${TESSERACT_OCR_ENGINE_MODE:3}

# Ollama
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}

# Diretórios
app.upload.dir=${UPLOAD_DIR:uploads}
app.processed.dir=${PROCESSED_DIR:processed}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/entrelinhas_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
