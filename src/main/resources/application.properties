spring.application.name=entrelinhas
spring.docker.compose.enabled=false
server.port=8002
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
logging.level.org.springframework.web=INFO
logging.level.com.entrelinhas=DEBUG

tesseract.datapath=${TESSERACT_DATA_PATH:C:/Program Files/Tesseract/tessdata}
tesseract.language=${TESSERACT_LANGUAGE:por}
tesseract.page-seg-mode=${TESSERACT_PAGE_SEG_MODE:3}
tesseract.ocr-engine-mode=${TESSERACT_OCR_ENGINE_MODE:3}

ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}

app.upload.dir=${UPLOAD_DIR:uploads}
app.processed.dir=${PROCESSED_DIR:processed}